name: max
description: "A Fashion App "

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  ionicons: ^0.2.2
  flutter_gap: ^1.2.0
  flutter_credit_card: ^4.1.0
  flutter_screenutil: ^5.9.3
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.2.1
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/mylogo.png"
  min_sdk_android: 21


flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/cover/
    - assets/logo/
    - assets/product/
    - assets/svgs/
    - assets/texts/
    - assets/pop/
    - assets/data/
    - assets/products_supa/
    - assets/products_supa/men/accessories/sunglasses/
    - assets/products_supa/men/accessories/watches/
    - assets/products_supa/men/clothing/jeans/
    - assets/products_supa/men/clothing/polos/
    - assets/products_supa/men/clothing/shirts/
    - assets/products_supa/men/clothing/shorts/
    - assets/products_supa/men/clothing/tshirts/
    - assets/products_supa/men/shoes/boots/
    - assets/products_supa/men/shoes/loafers/
    - assets/products_supa/men/shoes/running/
    - assets/products_supa/men/shoes/sneakers/
    - assets/products_supa/women/accessories/
    - assets/products_supa/women/accessories/bracelets/
    - assets/products_supa/women/accessories/earrings/
    - assets/products_supa/women/accessories/necklaces/
    - assets/products_supa/women/accessories/rings/
    - assets/products_supa/women/accessories/sunglasses/
    - assets/products_supa/women/accessories/watches/
    - assets/products_supa/women/bags/
    - assets/products_supa/women/clothing/blouses/
    - assets/products_supa/women/clothing/crop_tops/
    - assets/products_supa/women/clothing/dresses/
    - assets/products_supa/women/clothing/jeans/
    - assets/products_supa/women/clothing/skirts/
    - assets/products_supa/women/clothing/wide_leg_pants/
    - assets/products_supa/women/shoes/boots/
    - assets/products_supa/women/shoes/heels/

  fonts:
    - family: Tenor_Sans
      fonts:
        - asset: assets/fonts/Tenor_Sans/TenorSans-Regular.ttf
        

