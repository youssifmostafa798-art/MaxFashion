name: max
description: "A Fashion App "

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.1


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  ionicons: ^0.2.2
  flutter_gap: ^1.2.0
  flutter_credit_card: ^4.1.0
  flutter_screenutil: ^5.9.3
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  supabase_flutter: ^2.9.1
  flutter_dotenv: ^5.2.1
  skeletonizer: ^2.1.3
  glass_bottom_navigation_bar: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/mylogo.png"
  min_sdk_android: 21


flutter:
  generate: true

  uses-material-design: true

  assets:
    - .env
    - assets/logo/
    - assets/svgs/
    - assets/texts/
    - assets/pop/
    - assets/categories_icons/
    - assets/collections/

  fonts:
    - family: Tenor_Sans
      fonts:
        - asset: assets/fonts/Tenor_Sans/TenorSans-Regular.ttf
    - family: Noto_Sans_Arabic
      fonts:
        - asset: assets/fonts/Noto_Sans_Arabic/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/Noto_Sans_Arabic/NotoSansArabic-Bold.ttf
          weight: 700


